name: 'CodeQL'
# Must be called codeql.yml NOT codeql.yaml or GitHub will ignore it

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main', 'master']
    paths:
      - '!.github/**'
      - '!.docs/**'
  schedule:
    - cron: '40 4 * * 0'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  scan:
    name: 'Audit Repository'
    # yamllint disable-line rule:line-length
    uses: lfit/releng-reusable-workflows/.github/workflows/reuse-python-codeql.yaml@f43b219b8a91dcd082f26419008c8bf5544ec212  # v0.6.0
    permissions:
      # yamllint disable-line rule:line-length
      security-events: write  # Upload CodeQL results to the code-scanning dashboard
      packages: read  # Fetch internal or private CodeQL packs
      actions: read  # Required for workflows in private repositories
      contents: read  # Check out the repository to scan
