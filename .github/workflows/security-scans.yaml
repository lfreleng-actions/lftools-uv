# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.

name: 'Security Scans'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  # For Branch-Protection check. Only the default branch is supported. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
  branch_protection_rule:
  # To guarantee Maintained check is occasionally updated. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  schedule:
    - cron: '31 3 * * 0'
  push:
    branches:
      - 'main'
    paths:
      - '**'
      - '!**/.github/**'

# Declare default permissions as none.
permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sonatype-lifecycle:
    name: 'Sonatype Lifecycle'
    permissions:
      contents: read  # Reusable scan job checks out the repo
    # yamllint disable-line rule:line-length
    uses: lfit/releng-reusable-workflows/.github/workflows/reuse-sonatype-lifecycle.yaml@973bba87aa9cc4ab43242ba9afac37d70c72f134 # v0.9.1
    with:
      APPLICATION_ID: "lftools-uv"
    secrets:
      NEXUS_IQ_PASSWORD: "${{ secrets.NEXUS_IQ_PASSWORD }}"

  # Run pytest with coverage so the SonarCloud scan can ingest the report.
  # Mirrors the python-tests pattern from build-test.yaml; uploads
  # coverage.xml as a workflow artefact named 'sonarqube-coverage' for the
  # downstream SonarCloud job to download.
  python-tests:
    name: 'Python Tests (coverage)'
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Check out the repository to run the tests
    timeout-minutes: 12
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Python tests [pytest]'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-test-action@4129c285f63e4d004b9e615b881f44cd63ba5f45  # v1.2.0
        with:
          python_version: '3.14'
          artefact_name: 'sonarqube-coverage'

  # Scan results are found at: https://sonarcloud.io/login
  sonarqube-cloud:
    name: 'SonarQube Cloud'
    runs-on: ubuntu-24.04
    needs: 'python-tests'
    if: ${{ !cancelled() && needs.python-tests.result == 'success' }}
    # Dedicated environment so SONAR_TOKEN is accessed through a gated
    # environment rather than directly at the repository scope
    # (satisfies zizmor's secrets-outside-env).
    environment: 'sonarcloud'
    permissions:
      contents: read  # Check out the repository for the scan
      # yamllint disable-line rule:line-length
      security-events: write  # Upload scan results to the code-scanning dashboard
      id-token: write  # Publish results and obtain a badge via OIDC
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # SonarCloud uses git history for blame / new-code detection.
          fetch-depth: 0
          persist-credentials: false

      - name: 'Download coverage artefact'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sonarqube-coverage
          # Default extracts to ${{ github.workspace }} so coverage.xml
          # lands at the project root, where sonar.python.coverage.reportPaths
          # in sonar-project.properties expects it.

      - name: 'SonarQube Cloud scan'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/sonarqube-cloud-scan-action@b8d74f08d2222acb4556b71f9f3cd3e80bc8109b  # v1.2.1
        with:
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          # Workspace already populated by the steps above (checkout +
          # downloaded coverage artefact); skip the action's own checkout
          # so it does not wipe the coverage report.
          no_checkout: 'true'
