---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Runs on a new pull request, performs build and runs tests.
#
# Thin caller for the canonical reusable Python build/test pipeline in
# lfreleng-actions/python-workflows. Keeping the pipeline in the reusable
# workflow removes the bulk of the build/test logic from this repository's
# audit scope; the reusable is maintained centrally and already carries the
# hardening/Zizmor fixes.
name: 'Python Build/Test'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - master
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  build-test:
    name: 'Build/Test'
    permissions:
      contents: read  # Check out the repository to build and test
      pull-requests: read  # Read PR metadata for status reporting
    # Pinned to python-workflows v0.1.1 release commit
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/python-workflows/.github/workflows/build-test.yaml@cc69d423cff67cec2b67f05f8200dd261af5efab  # v0.3.3
    with:
      # Preserve the current behaviour: monitor egress (audit) rather than
      # enforce a block-mode allow-list. Switching to 'block' is a possible
      # follow-up once the allow-list is validated against this build.
      harden_runner_egress: 'audit'
