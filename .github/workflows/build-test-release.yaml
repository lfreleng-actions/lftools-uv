---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Runs on a tag push: builds, tests and promotes the release, then
# publishes to Test PyPI and PyPI.
#
# Thin caller for the canonical reusable Python build/test/release pipeline
# in lfreleng-actions/python-workflows. The reusable `release` job builds,
# tests, audits, generates the SBOM, scans with Grype, attaches artefacts
# and promotes the draft release, then exposes the validated `tag`.
#
# PyPI publishing runs HERE, not in the reusable workflow: trusted/token
# publishing is scoped to this repository's environments and credentials,
# so the publish jobs must live in this caller. They consume the run-scoped
# build artefact the reusable produced, keyed by its `tag` output.
name: 'Python Build/Test/Release'

# yamllint disable-line rule:truthy
on:
  # Trigger on tag push events
  push:
    tags:
      - '**'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 'Build/Test/Release'
    permissions:
      contents: write       # Create the GitHub release / attach assets
      id-token: write       # OIDC for build provenance attestations
      attestations: write   # Build provenance attestations
    # Pinned to python-workflows v0.1.1 release commit
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/python-workflows/.github/workflows/build-test-release.yaml@66435dec730390a6d28cd6eef72f99988fae4140  # v0.3.0
    with:
      # Preserve the current behaviour: monitor egress (audit) rather than
      # enforce a block-mode allow-list. Switching to 'block' is a possible
      # follow-up once the allow-list is validated against this pipeline.
      harden_runner_egress: 'audit'

  test-pypi:
    name: 'Test PyPI Publishing'
    needs: 'release'
    runs-on: 'ubuntu-latest'
    # MUST match the environment on the Test PyPI trusted publisher.
    environment:
      name: 'development'
    permissions:
      contents: read   # pypi-publish-action checks out the repo
      id-token: write  # Mandatory for trusted publishing (auto mode)
    timeout-minutes: 5
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: 'audit'

      - name: 'Test PyPI publishing'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/pypi-publish-action@8e46bf1bb34889591549c37d949d38fee1ab2d6b  # v0.1.9
        with:
          environment: 'development'
          # Preserve the prior pipeline's behaviour: 'auto' selects trusted
          # publishing when the package already exists on the index, and
          # falls back to the GitHub-secret credential otherwise.
          trusted_publishing: 'auto'
          tag: "${{ needs.release.outputs.tag }}"
          pypi_credential: "${{ secrets.TEST_PYPI_CREDENTIAL }}"

  pypi:
    name: 'Release PyPI Package'
    needs:
      - 'release'
      - 'test-pypi'
    runs-on: 'ubuntu-latest'
    # MUST match the environment on the PyPI trusted publisher.
    environment:
      name: 'production'
    permissions:
      contents: read   # pypi-publish-action checks out the repo
      id-token: write  # Trusted publishing (auto mode) and attestations
    timeout-minutes: 5
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: 'audit'

      - name: 'PyPI release'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/pypi-publish-action@8e46bf1bb34889591549c37d949d38fee1ab2d6b  # v0.1.9
        with:
          environment: 'production'
          attestations: true
          # Preserve the prior pipeline's behaviour: 'auto' selects trusted
          # publishing when the package already exists on the index (and is
          # required for attestation signing), falling back to the
          # GitHub-secret credential otherwise.
          trusted_publishing: 'auto'
          tag: "${{ needs.release.outputs.tag }}"
          pypi_credential: "${{ secrets.PYPI_CREDENTIAL }}"
